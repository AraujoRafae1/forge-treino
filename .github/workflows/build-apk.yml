name: Compilar APK Android e Publicar WebApp iPhone

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub

permissions:
  contents: write

jobs:
  build-apk:
    name: Gerar APK Android e Publicar WebApp
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Compilar aplicação Web
        run: npm run build

      - name: Sincronizar com Capacitor Android
        run: npx cap sync android

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Dar permissão de execução ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Forge-Treino-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar WebApp no GitHub Pages (iPhone & Web)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
